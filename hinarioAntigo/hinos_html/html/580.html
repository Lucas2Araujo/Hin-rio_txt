	<p>	
		Tua santa presença rogamos-Te, ó Senhor;<br/>
		Manda-nos Teu Espírito; dá-nos Teu santo poder.<br/>
		Queremos dar-Te graças, queremos Teu perdão;<br/>
		Queremos cantar louvores a Ti, por Teu infinito amor.
