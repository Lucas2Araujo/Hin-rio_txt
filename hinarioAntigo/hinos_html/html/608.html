	<p>	
		Que Deus te abençoe,<br/>
		E faça brilhar Seu rosto sobre ti;<br/>
		E que o Senhor te dê a paz;<br/>
		Sim, Deus sobre ti levante o rosto Seu;
	</p>

	<p>	
		Que te guarde e abençoe sempre.<br/>
		Misericórdia tenha<br/>
		Deus de ti. Amém.
