<body>
	<p>	
		Oh, como é bom louvar a Deus,<br/>
		Sempre louvá-Lo assim!<br/>
		Por Seu amor, favores Seus,<br/>
		Louvor terá de mim.

	</p>

	<p>	
		Meu coração de pedra é,<br/>
		Mas novo há de ser,<br/>
		Quando por fim co'amor e fé,<br/>
		Jesus mudar meu ser.
	</p>

	<p>	
		Ao palmilhar a senda aqui,<br/>
		Faze-me bom, Senhor.<br/>
		Possa viver, viver por Ti,<br/>
		Em Teu divino amor.
	</p>
